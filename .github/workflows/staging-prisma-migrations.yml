name: Staging Prisma Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_staging_migration:
        description: "Type yes to apply pending Prisma migrations to DentalFlow staging"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: dentalflow-staging-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm_staging_migration == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - name: Validate staging-only connection
        shell: bash
        run: |
          node <<'NODE'
          const value = process.env.STAGING_DATABASE_URL;
          if (!value) {
            console.error("Missing repository secret STAGING_DATABASE_URL.");
            process.exit(1);
          }
          let url;
          try {
            url = new URL(value);
          } catch {
            console.error("STAGING_DATABASE_URL is not a valid PostgreSQL URL.");
            process.exit(1);
          }
          const expectedRef = "zlloccntplmjtmqpntiy";
          const isExpectedProject =
            url.hostname.includes(expectedRef) ||
            decodeURIComponent(url.username).includes(expectedRef);
          if (!["postgres:", "postgresql:"].includes(url.protocol)) {
            console.error("Expected a PostgreSQL connection URL.");
            process.exit(1);
          }
          if (!isExpectedProject) {
            console.error("Refusing to migrate: connection does not identify DentalFlow staging.");
            process.exit(1);
          }
          if (url.port !== "5432") {
            console.error("Use the direct database connection or Supabase session pooler on port 5432; transaction pooler port 6543 is not supported for migrations.");
            process.exit(1);
          }
          console.log("Connection target validated as DentalFlow staging; credentials are not displayed.");
          NODE

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show pending migration status
        # Prisma exits with code 1 when unapplied migrations exist; that is expected here.
        # The deploy step below is the authoritative connection and migration check.
        continue-on-error: true
        run: npx prisma migrate status

      - name: Clear the interrupted patient archive migration state
        # The prior attempt failed after creating the schema objects. The migration SQL is
        # now idempotent, so allow Prisma to retry it. If already resolved, deploy and the
        # final status check remain authoritative.
        continue-on-error: true
        run: npx prisma migrate resolve --rolled-back 20261114090000_patient_archive

      - name: Clear the interrupted patient lead conversion migration state
        # The failed migration was split so the enum value commits before dependent DDL.
        continue-on-error: true
        run: npx prisma migrate resolve --rolled-back 20261118170000_patient_lead_conversion

      - name: Apply pending Prisma migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status
