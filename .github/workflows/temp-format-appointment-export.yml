name: Temporary appointment export formatter

on:
  push:
    branches:
      - feat/appointment-calendar-export

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/appointment-calendar-export
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'src/app/clinic/[clinicId]/appointments/export/route.ts' 'src/app/clinic/[clinicId]/appointments/page.tsx'
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/clinic/[clinicId]/appointments/export/route.ts' 'src/app/clinic/[clinicId]/appointments/page.tsx'
          git commit -m "style(appointments): format calendar export"
          git push
