name: Temporary Prettier fix

on:
  push:
    branches:
      - feat/clinic-financial-overview

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'src/app/clinic/[clinicId]/reports/page.tsx'
      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/clinic/[clinicId]/reports/page.tsx'
          git commit -m "style(reports): apply Prettier formatting"
          git push
