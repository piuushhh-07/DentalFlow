name: Production Prisma Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: "Type yes to apply pending Prisma migrations to DentalFlow production"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: dentalflow-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm_production_migration == 'yes' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Validate production-only connection
        shell: bash
        run: |
          node <<'NODE'
          const value = process.env.PRODUCTION_DATABASE_URL;
          if (!value) {
            console.error("Missing repository/environment secret PRODUCTION_DATABASE_URL.");
            process.exit(1);
          }
          let url;
          try {
            url = new URL(value);
          } catch {
            console.error("PRODUCTION_DATABASE_URL is not a valid PostgreSQL URL.");
            process.exit(1);
          }
          const expectedRef = "paelfcdieccydwvtcyeq";
          const isExpectedProject =
            url.hostname.includes(expectedRef) ||
            decodeURIComponent(url.username).includes(expectedRef);
          if (!["postgres:", "postgresql:"].includes(url.protocol)) {
            console.error("Expected a PostgreSQL connection URL.");
            process.exit(1);
          }
          if (!isExpectedProject) {
            console.error("Refusing to migrate: connection does not identify DentalFlow production.");
            process.exit(1);
          }
          if (url.port !== "5432") {
            console.error("Use the direct database connection or Supabase session pooler on port 5432; transaction pooler port 6543 is not supported for migrations.");
            process.exit(1);
          }
          console.log("Connection target validated as DentalFlow production; credentials are not displayed.");
          NODE

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show pending migration status
        run: npx prisma migrate status

      - name: Apply pending Prisma migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status
