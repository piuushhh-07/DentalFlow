name: Temporary expense formatter

on:
  push:
    branches:
      - feat/clinic-expense-management

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/clinic-expense-management
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Format changed feature files
        run: |
          npx prettier --write \
            "src/app/clinic/[clinicId]/expenses/page.tsx" \
            "src/features/expenses/actions.ts" \
            "src/components/layout/app-navigation.tsx" \
            "src/components/layout/app-shell.tsx" \\
            ".github/workflows/temp-format-expenses.yml"
      - name: Commit formatting
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "src/app/clinic/[clinicId]/expenses/page.tsx" "src/features/expenses/actions.ts" "src/components/layout/app-navigation.tsx" "src/components/layout/app-shell.tsx" ".github/workflows/temp-format-expenses.yml"
            git commit -m "style: format clinic expense workspace"
            git push
          fi
