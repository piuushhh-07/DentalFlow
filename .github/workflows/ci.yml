name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/dentalflow?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/dentalflow?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_DENTALFLOW_DEMO_MODE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check formatting of changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            CHANGED_FILES="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.mts' '*.cts' '*.json' '*.md' '*.mdx' '*.css' '*.scss' '*.html' '*.yml' '*.yaml')"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            CHANGED_FILES="$(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.mts' '*.cts' '*.json' '*.md' '*.mdx' '*.css' '*.scss' '*.html' '*.yml' '*.yaml')"
          else
            CHANGED_FILES="$(git ls-files '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.mts' '*.cts' '*.json' '*.md' '*.mdx' '*.css' '*.scss' '*.html' '*.yml' '*.yaml')"
          fi

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No Prettier-supported files changed."
            exit 0
          fi

          mapfile -t FILES <<< "$CHANGED_FILES"
          npx prettier --write "${FILES[@]}"

      - name: Upload formatter output for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-formatted-billing-repository
          path: src/features/billing/lib/billing-repository.ts

      - name: Build
        run: npm run build
