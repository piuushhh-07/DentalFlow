name: Temporary format patient billing workspace

on:
  push:
    branches:
      - feat/clinic-billing-workspace

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/clinic-billing-workspace
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format billing workspace files
        run: |
          npx prettier --write \
            "src/features/treatments/lib/treatment-finance.ts" \
            "src/app/clinic/[clinicId]/billing/patient-ledger/page.tsx" \
            "src/components/layout/app-navigation.tsx" \
            "src/components/layout/app-shell.tsx"

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "All billing workspace files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/features/treatments/lib/treatment-finance.ts" \
            "src/app/clinic/[clinicId]/billing/patient-ledger/page.tsx" \
            "src/components/layout/app-navigation.tsx" \
            "src/components/layout/app-shell.tsx"
          git commit -m "style(billing): apply Prettier formatting"
          git push origin HEAD:feat/clinic-billing-workspace
