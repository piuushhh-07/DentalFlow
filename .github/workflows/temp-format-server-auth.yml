name: Temporary server auth formatter

on:
  push:
    branches:
      - perf/clinic-page-load-optimization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/clinic-page-load-optimization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'src/features/auth/lib/server-auth.ts'
      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/features/auth/lib/server-auth.ts'
          git commit -m "style(auth): apply exact Prettier formatting"
          git push
