name: Temporary inventory formatter

on:
  push:
    branches:
      - feat/clinic-inventory-management

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-inventory-management
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed TypeScript files
        shell: bash
        run: |
          git fetch origin master
          CHANGED_FILES="$(git diff --name-only --diff-filter=ACMR origin/master...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.mts' '*.cts' '*.json' '*.md' '*.mdx' '*.css' '*.scss' '*.html' '*.yml' '*.yaml')"
          if [[ -z "$CHANGED_FILES" ]]; then exit 0; fi
          mapfile -t FILES <<< "$CHANGED_FILES"
          npx prettier --write "${FILES[@]}"
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format inventory workspace"
          git push origin HEAD:feat/clinic-inventory-management
